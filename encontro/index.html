<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adolecrist - Fichas do Encontro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="tela-login" class="login-container">
        <div class="login-box">
            <h1 style="color:#00d4ff; margin-bottom:0.5rem;">Adolecrist</h1>
            <p style="color:#aaa; margin-bottom:1.5rem;">Fichas do Encontro</p>
            <input type="password" id="input-senha" placeholder="Digite a senha..." class="login-input">
            <button id="btn-login" class="btn btn-primary" style="width:100%; margin-top:0.8rem;">Entrar</button>
            <p id="login-erro" style="color:#e74c3c; margin-top:0.5rem; display:none;">Senha incorreta</p>
        </div>
    </div>

    <!-- App principal (escondido ate login) -->
    <div id="app-container" style="display:none;">
        <header>
            <div class="header-top">
                <h1>Adolecrist - Fichas do Encontro</h1>
                <div class="header-relogio">
                    <span id="relogio-header"></span>
                    <small id="data-header"></small>
                </div>
            </div>
            <nav>
                <button class="nav-btn active" data-page="painel">Painel de Alertas</button>
                <button class="nav-btn" data-page="cronograma">Cronograma</button>
                <button class="nav-btn" data-page="cadastro">Cadastrar Ficha</button>
                <button class="nav-btn" data-page="fichas">Ver Fichas</button>
                <button class="nav-btn" data-page="historico">Historico</button>
            </nav>
        </header>
        <div id="status-sync" class="status-sync"></div>
        <main id="app"></main>
    </div>
    <script src="app.js"></script>
</body>
</html>
