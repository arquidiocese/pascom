<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscritos - Recepção Criativa</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a3a7a, #2952a3);
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .header h1 {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .btn-voltar {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-voltar:hover {
            background: rgba(255,255,255,0.25);
        }
        .btn-exportar {
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-exportar:hover {
            background: #15803d;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e8edf3;
            min-width: 120px;
        }
        .stat-num {
            font-size: 2rem;
            font-weight: 800;
            color: #1a3a7a;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* Busca e filtros */
        .filtros {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem 1rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .busca {
            flex: 1;
            min-width: 200px;
            padding: 0.7rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            background: #fff;
            transition: all 0.3s;
        }
        .busca:focus {
            outline: none;
            border-color: #2952a3;
            box-shadow: 0 0 0 3px rgba(41,82,163,0.1);
        }
        .filtro-select {
            padding: 0.7rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: 'Montserrat', sans-serif;
            background: #fff;
            cursor: pointer;
        }

        /* Lista */
        .lista-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem 2rem;
        }
        .lista-table {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e8edf3;
        }
        .lista-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .lista-table th {
            background: #f8fafc;
            padding: 0.8rem 1rem;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }
        .lista-table td {
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }
        .lista-table tr:hover td {
            background: #f8fafc;
        }
        .lista-table .nome-cell {
            font-weight: 600;
            color: #1e293b;
        }
        .badge-vocacao {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #e0e7ff;
            color: #3730a3;
        }
        .btn-editar {
            background: #e0f2fe;
            color: #0369a1;
            border: none;
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-editar:hover {
            background: #0369a1;
            color: #fff;
        }
        .btn-remover {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-remover:hover {
            background: #dc2626;
            color: #fff;
        }
        .acoes-cell {
            display: flex;
            gap: 0.3rem;
        }

        .vazio {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
            font-style: italic;
        }

        /* Modal de Edição */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9000;
            padding: 1rem;
        }
        .modal-overlay.ativo {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 2rem 1.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .modal h2 {
            color: #1a3a7a;
            font-size: 1.1rem;
            margin-bottom: 1.2rem;
            text-align: center;
        }
        .modal .form-group {
            margin-bottom: 1rem;
        }
        .modal .form-group label {
            display: block;
            color: #4a5568;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            color: #2d3748;
            background: #f7fafc;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            outline: none;
            border-color: #2952a3;
            box-shadow: 0 0 0 3px rgba(41,82,163,0.1);
        }
        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .modal-btns {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }
        .modal-btns button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-salvar {
            background: linear-gradient(135deg, #1a3a7a, #2952a3);
            color: #fff;
        }
        .btn-salvar:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26,58,122,0.3);
        }
        .btn-cancelar {
            background: #f1f5f9;
            color: #64748b;
        }
        .btn-cancelar:hover {
            background: #e2e8f0;
        }

        /* Responsivo - cards em mobile */
        .lista-mobile {
            display: none;
        }

        @media (max-width: 700px) {
            .lista-table { display: none; }
            .lista-mobile { display: block; }
            .inscrito-card {
                background: #fff;
                border: 1px solid #e8edf3;
                border-radius: 12px;
                padding: 1rem;
                margin-bottom: 0.8rem;
                box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            }
            .inscrito-card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 0.5rem;
            }
            .inscrito-card-nome {
                font-weight: 700;
                color: #1e293b;
                font-size: 0.95rem;
            }
            .inscrito-card-info {
                font-size: 0.8rem;
                color: #64748b;
                line-height: 1.6;
            }
            .inscrito-card-info strong {
                color: #334155;
            }
            .inscrito-card-acoes {
                display: flex;
                gap: 0.4rem;
                margin-top: 0.6rem;
            }
            .header h1 { font-size: 0.95rem; }
            .stats { padding: 1rem; gap: 0.5rem; }
            .stat-card { padding: 0.8rem 1rem; min-width: 80px; }
            .stat-num { font-size: 1.5rem; }
            .modal .form-row { grid-template-columns: 1fr; }
        }

        /* Tela de Login */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a3a7a, #2952a3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-box {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-box h2 {
            color: #1a3a7a;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .login-box p {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .login-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }
        .login-box input:focus {
            outline: none;
            border-color: #2952a3;
            box-shadow: 0 0 0 3px rgba(41,82,163,0.1);
        }
        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #1a3a7a, #2952a3);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26,58,122,0.3);
        }
        .login-erro {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Tela de Senha -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>🔒 Área Administrativa</h2>
            <p>Digite a senha para acessar a lista de inscritos</p>
            <input type="password" id="login-senha" placeholder="Senha..." autofocus>
            <button class="login-btn" id="login-btn">Entrar</button>
            <p class="login-erro" id="login-erro">Senha incorreta. Tente novamente.</p>
        </div>
    </div>

    <!-- Painel (oculto até autenticar) -->
    <div id="painel" style="display:none;">
        <header class="header">
            <h1>📋 Inscritos — Recepção Criativa</h1>
            <div class="header-actions">
                <a href="index.html" class="btn-voltar">← Voltar</a>
                <button class="btn-exportar" onclick="exportarCSV()">⬇ Exportar CSV</button>
            </div>
        </header>

        <div class="stats" id="stats"></div>

        <div class="filtros">
            <input type="text" class="busca" id="busca" placeholder="Buscar por nome, cidade, paróquia...">
            <select class="filtro-select" id="filtro-vocacao">
                <option value="">Todas as funções</option>
                <option value="Arcebispo">Arcebispo</option>
                <option value="Bispo">Bispo</option>
                <option value="Padre">Padre</option>
                <option value="Diácono">Diácono</option>
                <option value="Seminarista">Seminarista</option>
                <option value="Religioso(a)">Religioso(a)</option>
                <option value="Liderança Leiga">Liderança Leiga</option>
            </select>
        </div>

        <div class="lista-container">
            <div class="lista-table" id="lista-table"></div>
            <div class="lista-mobile" id="lista-mobile"></div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div class="modal-overlay" id="modal-editar">
        <div class="modal">
            <h2>✏️ Editar Inscrição</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="edit-nome">
            </div>
            <div class="form-group">
                <label>Função</label>
                <select id="edit-vocacao">
                    <option value="Arcebispo">Arcebispo</option>
                    <option value="Bispo">Bispo</option>
                    <option value="Padre">Padre</option>
                    <option value="Diácono">Diácono</option>
                    <option value="Seminarista">Seminarista</option>
                    <option value="Religioso(a)">Religioso(a)</option>
                    <option value="Liderança Leiga">Liderança Leiga</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Diocese</label>
                    <input type="text" id="edit-diocese">
                </div>
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="edit-cidade">
                </div>
            </div>
            <div class="form-group">
                <label>Paróquia</label>
                <input type="text" id="edit-paroquia">
            </div>
            <div class="form-group">
                <label>Telefone / Contato</label>
                <input type="tel" id="edit-telefone">
            </div>
            <div class="modal-btns">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarEdicao()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO - Mesma URL do Google Apps Script usada no index.html
        // ============================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx85nfUyO3_OHy-JMybDG5w5fG3HmEwImD3fxr2l6OqBNzwgLYkUl-K9Rx836O6yq5QKQ/exec';

        // === AUTENTICAÇÃO ===
        const SENHA_ADMIN = 'Pascom123456';

        document.getElementById('login-btn').addEventListener('click', tentarLogin);
        document.getElementById('login-senha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') tentarLogin();
        });

        function tentarLogin() {
            const senha = document.getElementById('login-senha').value;
            if (senha === SENHA_ADMIN) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
                carregarInscritos();
            } else {
                document.getElementById('login-erro').style.display = 'block';
                document.getElementById('login-senha').value = '';
                document.getElementById('login-senha').focus();
            }
        }

        // === DADOS (vindos do Google Sheets) ===
        let inscritosData = [];

        async function carregarInscritos() {
            if (!SCRIPT_URL) {
                document.getElementById('lista-table').innerHTML = '<p class="vazio">URL do Google Apps Script não configurada.</p>';
                document.getElementById('lista-mobile').innerHTML = '<p class="vazio">URL do Google Apps Script não configurada.</p>';
                return;
            }

            document.getElementById('lista-table').innerHTML = '<p class="vazio">Carregando inscritos...</p>';
            document.getElementById('lista-mobile').innerHTML = '<p class="vazio">Carregando inscritos...</p>';

            try {
                const response = await fetch(SCRIPT_URL + '?acao=listar');
                const dados = await response.json();
                inscritosData = dados || [];
                renderStats();
                renderLista();
            } catch (erro) {
                console.error('Erro ao carregar:', erro);
                document.getElementById('lista-table').innerHTML = '<p class="vazio">Erro ao carregar dados. Verifique a conexão.</p>';
                document.getElementById('lista-mobile').innerHTML = '<p class="vazio">Erro ao carregar dados. Verifique a conexão.</p>';
            }
        }

        // === ESTATÍSTICAS ===
        function renderStats() {
            const inscritos = inscritosData;
            const vocacoes = {};
            inscritos.forEach(i => {
                vocacoes[i.vocacao] = (vocacoes[i.vocacao] || 0) + 1;
            });

            let html = `<div class="stat-card"><div class="stat-num">${inscritos.length}</div><div class="stat-label">Total</div></div>`;
            Object.entries(vocacoes).sort((a,b) => b[1] - a[1]).forEach(([v, n]) => {
                html += `<div class="stat-card"><div class="stat-num">${n}</div><div class="stat-label">${v}</div></div>`;
            });
            document.getElementById('stats').innerHTML = html;
        }

        // === LISTA ===
        function renderLista() {
            const busca = document.getElementById('busca').value.trim().toLowerCase();
            const filtroVocacao = document.getElementById('filtro-vocacao').value;
            let inscritos = [...inscritosData];

            if (busca) {
                inscritos = inscritos.filter(i =>
                    (i.nome || '').toLowerCase().includes(busca) ||
                    (i.cidade || '').toLowerCase().includes(busca) ||
                    (i.paroquia || '').toLowerCase().includes(busca) ||
                    (i.diocese || '').toLowerCase().includes(busca) ||
                    (i.telefone || '').includes(busca)
                );
            }
            if (filtroVocacao) {
                inscritos = inscritos.filter(i => i.vocacao === filtroVocacao);
            }

            if (!inscritos.length) {
                document.getElementById('lista-table').innerHTML = '<p class="vazio">Nenhum inscrito encontrado.</p>';
                document.getElementById('lista-mobile').innerHTML = '<p class="vazio">Nenhum inscrito encontrado.</p>';
                return;
            }

            // Tabela desktop
            let tableHtml = `<table>
                <thead><tr>
                    <th>Nome</th>
                    <th>Função</th>
                    <th>Diocese</th>
                    <th>Cidade</th>
                    <th>Paróquia</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr></thead><tbody>`;

            inscritos.forEach((i, idx) => {
                const linha = i._linha || idx;
                tableHtml += `<tr>
                    <td class="nome-cell">${i.nome || ''}</td>
                    <td><span class="badge-vocacao">${i.vocacao || ''}</span></td>
                    <td>${i.diocese || ''}</td>
                    <td>${i.cidade || ''}</td>
                    <td>${i.paroquia || '—'}</td>
                    <td>${i.telefone || ''}</td>
                    <td><div class="acoes-cell">
                        <button class="btn-editar" onclick="abrirEdicao(${linha})">Editar</button>
                        <button class="btn-remover" onclick="remover(${linha})">Excluir</button>
                    </div></td>
                </tr>`;
            });
            tableHtml += '</tbody></table>';
            document.getElementById('lista-table').innerHTML = tableHtml;

            // Cards mobile
            let mobileHtml = '';
            inscritos.forEach((i, idx) => {
                const linha = i._linha || idx;
                mobileHtml += `<div class="inscrito-card">
                    <div class="inscrito-card-header">
                        <span class="inscrito-card-nome">${i.nome || ''}</span>
                        <span class="badge-vocacao">${i.vocacao || ''}</span>
                    </div>
                    <div class="inscrito-card-info">
                        <strong>Diocese:</strong> ${i.diocese || ''}<br>
                        <strong>Cidade:</strong> ${i.cidade || ''}<br>
                        ${i.paroquia ? '<strong>Paróquia:</strong> ' + i.paroquia + '<br>' : ''}
                        <strong>Telefone:</strong> ${i.telefone || ''}
                    </div>
                    <div class="inscrito-card-acoes">
                        <button class="btn-editar" onclick="abrirEdicao(${linha})">Editar</button>
                        <button class="btn-remover" onclick="remover(${linha})">Excluir</button>
                    </div>
                </div>`;
            });
            document.getElementById('lista-mobile').innerHTML = mobileHtml;
        }

        // === EDITAR ===
        function abrirEdicao(linha) {
            const i = inscritosData.find(x => x._linha === linha);
            if (!i) return;

            document.getElementById('edit-id').value = linha;
            document.getElementById('edit-nome').value = i.nome || '';
            document.getElementById('edit-vocacao').value = i.vocacao || '';
            document.getElementById('edit-diocese').value = i.diocese || '';
            document.getElementById('edit-cidade').value = i.cidade || '';
            document.getElementById('edit-paroquia').value = i.paroquia || '';
            document.getElementById('edit-telefone').value = i.telefone || '';

            document.getElementById('modal-editar').classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('modal-editar').classList.remove('ativo');
        }

        async function salvarEdicao() {
            const linha = parseInt(document.getElementById('edit-id').value);
            const dados = {
                acao: 'editar',
                linha: linha,
                nome: document.getElementById('edit-nome').value.trim(),
                vocacao: document.getElementById('edit-vocacao').value,
                diocese: document.getElementById('edit-diocese').value.trim(),
                cidade: document.getElementById('edit-cidade').value.trim(),
                paroquia: document.getElementById('edit-paroquia').value.trim(),
                telefone: document.getElementById('edit-telefone').value.trim()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                fecharModal();
                // Recarrega após breve espera para o script processar
                setTimeout(() => carregarInscritos(), 1000);
            } catch (erro) {
                alert('Erro ao salvar. Tente novamente.');
            }
        }

        // Fechar modal clicando fora
        document.getElementById('modal-editar').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });

        // === EXCLUIR ===
        async function remover(linha) {
            if (!confirm('Tem certeza que deseja excluir esta inscrição?')) return;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ acao: 'excluir', linha: linha })
                });
                // Recarrega após breve espera para o script processar
                setTimeout(() => carregarInscritos(), 1000);
            } catch (erro) {
                alert('Erro ao excluir. Tente novamente.');
            }
        }

        // === EXPORTAR CSV ===
        function exportarCSV() {
            const inscritos = inscritosData;
            if (!inscritos.length) { alert('Nenhum inscrito para exportar.'); return; }

            let csv = 'Nome,Função,Diocese,Cidade,Paróquia,Telefone,Data Inscrição\n';
            inscritos.forEach(i => {
                csv += `"${i.nome || ''}","${i.vocacao || ''}","${i.diocese || ''}","${i.cidade || ''}","${i.paroquia || ''}","${i.telefone || ''}","${i.dataInscricao || ''}"\n`;
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'inscritos-recepcao-criativa.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        // === EVENTOS ===
        document.getElementById('busca').addEventListener('input', renderLista);
        document.getElementById('filtro-vocacao').addEventListener('change', renderLista);
    </script>
</body>
</html>
